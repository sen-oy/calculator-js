<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.js">
    <script defer src="script.js"></script>
</head>
<body>
    <div id="calculator-container">
        <div id="calculator-display">
            <div id="calculator-upper-display" class="calculator-sub-display"></div>
            <div id="calculator-main-display" class="calculator-sub-display"></div>
        </div>
        <div id="calculator-buttons">
            <button id="backspace-button" class="display-button">Backspace</button>
            <button id="clear-button" class="display-button">Clear</button>
            <button id="modulo-button" class="operator-button">%</button>
            <button id="divide-button" class="operator-button">÷</button>

            <button id="seven-button" class="number-button">7</button>
            <button id="eight-button" class="number-button">8</button>
            <button id="nine-button" class="number-button">9</button>
            <button id="multiply-button" class="operator-button">x</button>

            <button id="four-button" class="number-button">4</button>
            <button id="five-button" class="number-button">5</button>
            <button id="six-button" class="number-button">6</button>
            <button id="minus-button" class="operator-button">-</button>

            <button id="one-button" class="number-button">1</button>
            <button id="two-button" class="number-button">2</button>
            <button id="three-button" class="number-button">3</button>
            <button id="plus-button" class="operator-button">+</button>

            <button id="zero-button" class="number-button">0</button>
            <button id="dot-button" class="display-button">.</button>
            <button id="positive-negative-button" class="display-button">+/-</button>
            <button id="equals-button" class="display-button">=</button>
        </div>
    </div>
</body>
</html>
